name: CI/CD

# Único camino a producción: vercel.json desactiva el deploy por Git y el job `deploy` solo corre
# cuando pasan `quality` y `e2e` en `main`. Plan completo: docs/09-deploy/README.md.
# Trigger `pull_request` (nunca `pull_request_target`): los PRs de forks no reciben secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Placeholder: prisma generate/validate y el build no se conectan a la base.
  DATABASE_URL_PLACEHOLDER: postgresql://user:pass@localhost:5432/placeholder

jobs:
  # Paso 1 — Build & Schema check
  quality:
    name: 1 · Build y esquema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar esquema Prisma
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_PLACEHOLDER }}
      - name: Build de producción (prisma generate + tipos SPA/API + vite build)
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_PLACEHOLDER }}
      - name: Auditoría de dependencias (informativa)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # Paso 2 — Gate de pruebas End-to-End
  e2e:
    name: 2 · Playwright E2E (Chromium)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      # Sin secrets: playwright.config.ts levanta `npm run dev` con DATABASE_URL='' y
      # tests/global-setup.ts aborta si la API no está en modo memoria. Nunca toca Neon.
      - name: Correr Playwright
        run: npx playwright test
        env:
          CI: 'true'
      - name: Subir reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Paso 3 — Deploy a producción (solo si pasaron build y E2E)
  deploy:
    name: 3 · Deploy a producción (Vercel)
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      method: ${{ steps.deploy.outputs.method }}
    steps:
      # Opción A (recomendada): Deploy Hook. Vercel construye `main` con sus variables de
      # Production; CI no ve ningún secret de la app. La URL del hook es un secret.
      # Opción B: Vercel CLI con token, si no hay hook configurado.
      - name: Disparar deploy
        id: deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null
            echo "method=hook" >> "$GITHUB_OUTPUT"
            echo "Deploy Hook disparado para \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
            echo "method=cli" >> "$GITHUB_OUTPUT"
            echo "Deploy por CLI de \`$GITHUB_SHA\`: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Falta VERCEL_DEPLOY_HOOK_URL (o VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID)"
            exit 1
          fi

  # Paso 4 — Smoke tests post-deploy (solo lectura)
  smoke:
    name: 4 · Smoke post-deploy
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      statuses: read
    steps:
      # El hook responde enseguida y Vercel construye después: se espera el estado `Vercel` de
      # ESTE commit para no verificar el deployment anterior. El CLI ya espera hasta Ready.
      - name: Esperar el deployment de este commit
        if: needs.deploy.outputs.method == 'hook'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            s=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '[.statuses[] | select(.context | test("Vercel"))] | first | .state // "none"')
            echo "[$i] estado Vercel: $s"
            case "$s" in
              success) exit 0 ;;
              failure|error) echo "El deployment de Vercel falló"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Tiempo agotado esperando el deployment"; exit 1

      - name: Chequeos GET de solo lectura
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ]; then echo "Falta la variable PRODUCTION_URL"; exit 1; fi
          BASE_URL="${BASE_URL%/}"
          code() { curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$@"; }
          check() { [ "$2" = "$3" ] && echo "OK   $1 -> $2" || { echo "FAIL $1 -> $2 (esperado $3)"; exit 1; }; }

          check "GET /" "$(code "$BASE_URL/")" 200
          check "GET /cotizador-tecnico" "$(code "$BASE_URL/cotizador-tecnico")" 200
          check "GET /admin" "$(code "$BASE_URL/admin")" 200
          check "GET /api/health" "$(code "$BASE_URL/api/health")" 200

          # La Function llega a Neon: storage tiene que ser "database", nunca "memory".
          curl -sf --retry 5 --retry-delay 5 "$BASE_URL/api/health" \
            | python3 -c 'import json,sys; b=json.load(sys.stdin); assert b.get("storage")=="database", b; print("OK   /api/health storage=database")'

          # Sin token, la API de admin no expone PII.
          check "GET /api/admin/quotes sin token" "$(code "$BASE_URL/api/admin/quotes")" 401
